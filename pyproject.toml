[project]
name = "ratd"
version = "0.1.0"
description = "Mouse configuration service for Linux (Logitech HID++ host mode, per-app profiles)"
requires-python = ">=3.11"
dependencies = ["evdev", "pyudev", "dbus-next"]

[project.scripts]
ratd = "ratd.daemon:run"
ratctl = "ratd.ctl:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratd*"]
